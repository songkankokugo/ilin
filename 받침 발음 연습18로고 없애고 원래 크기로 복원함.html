<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>받침 크러셔 (パッチムクラッシャー)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@600;700;800;900&family=Noto+Sans+KR:wght@600;700;900&display=swap');

    body {
      font-family: 'Noto Sans KR', 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #020617;
      color: white;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(-50%) scale(1); }
      20% { transform: translateX(calc(-50% - 10px)) scale(1.02); }
      40% { transform: translateX(calc(-50% + 10px)) scale(0.98); }
      60% { transform: translateX(calc(-50% - 6px)) scale(1.01); }
      80% { transform: translateX(calc(-50% + 6px)) scale(0.99); }
    }
    .shake-anim { animation: shake 0.38s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes snapUp {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .snap-anim { animation: snapUp 0.15s ease-out forwards; }

    @keyframes crushBurst {
      0% { transform: translateX(-50%) scale(1); filter: brightness(1); }
      40% { transform: translateX(-50%) scale(1.2); filter: brightness(1.5); box-shadow: 0 0 20px #10b981; }
      100% { transform: translateX(-50%) scale(0); opacity: 0; filter: brightness(2); }
    }
    .crush-anim { animation: crushBurst 0.35s ease-out forwards; }

    .retro-btn {
      box-shadow: 0 4px 0 #0f172a, 0 8px 10px rgba(0,0,0,0.3);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .retro-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #0f172a, 0 2px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Audio Unlock Overlay -->
  <div id="unlockOverlay" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="text-6xl mb-6 animate-bounce">🎧</div>
    <h1 class="text-2xl font-black mb-2">音声の準備</h1>
    <p class="text-sm text-slate-400 mb-8">ブラウザの仕様により、<br>画面をタップして音声を有効にする必要があります。</p>
    <button id="btnUnlock" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-lg px-8 py-4 rounded-full shadow-lg shadow-pink-500/30 active:scale-95 transition-all w-full max-w-xs">
      画面をタップして開始
    </button>
  </div>

  <!-- Main Game Container -->
  <main id="appContainer" class="w-full max-w-sm h-full flex flex-col relative bg-slate-900 overflow-hidden hidden shadow-2xl sm:border-x sm:border-slate-800">
    
    <!-- Top Header -->
    <header class="p-3 bg-slate-950 flex items-center justify-between z-20 shrink-0">
      <div class="flex items-center space-x-2">
        <button id="btnHome" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 active:scale-95 transition-all">
          <i class="ph-bold ph-house text-lg"></i>
        </button>
        <span id="stageBadge" class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400">Stage 1</span>
      </div>
      
      <!-- 5 Hearts -->
      <div id="heartsContainer" class="flex items-center space-x-0.5">
        <i class="ph-fill ph-heart text-red-500 text-sm" id="h1"></i>
        <i class="ph-fill ph-heart text-red-500 text-sm" id="h2"></i>
        <i class="ph-fill ph-heart text-red-500 text-sm" id="h3"></i>
        <i class="ph-fill ph-heart text-red-500 text-sm" id="h4"></i>
        <i class="ph-fill ph-heart text-red-500 text-sm" id="h5"></i>
      </div>

      <div class="text-right">
        <div class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">SCORE</div>
        <div id="scoreDisplay" class="font-mono font-black text-amber-400 text-base leading-none">0000</div>
      </div>
    </header>

    <div class="w-full bg-slate-800 h-1 z-20 shrink-0">
      <div id="progressBar" class="bg-gradient-to-r from-pink-500 to-indigo-500 h-1 transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Hint Panel (상단 독립 분리) -->
    <div class="px-3 pt-2 pb-1 bg-slate-900 shrink-0 z-10">
      <div class="p-2.5 rounded-xl bg-slate-800/90 border border-slate-700 flex items-center shadow-lg">
        <div id="hintEmoji" class="text-3xl bg-slate-900 w-12 h-12 rounded-lg flex items-center justify-center border border-slate-700/50 mr-3 overflow-hidden p-1 shrink-0">❓</div>
        <div class="flex-1 min-w-0">
          <div class="text-[10px] uppercase font-bold text-indigo-400">意味</div>
          <div id="hintMeaningJa" class="text-base font-black text-white leading-tight truncate">準備中...</div>
        </div>
        <button id="btnReplayAudio" class="p-2.5 rounded-lg bg-pink-600 active:bg-pink-700 active:scale-95 transition-all text-white shadow-md shrink-0">
          <i class="ph-bold ph-speaker-high text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Play Area (글자 낙하 필드) -->
    <div class="flex-1 relative overflow-hidden bg-slate-900" id="playField">
      
      <div id="fallingBlockWrapper" class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none z-10" style="top: -120px;">
        <div id="countdownText" class="absolute -top-9 text-2xl font-black text-amber-400 drop-shadow-md hidden">5</div>
        
        <div id="syllableBox" class="w-22 h-22 sm:w-24 sm:h-24 rounded-2xl bg-indigo-600 border-4 border-indigo-400 shadow-xl flex flex-col items-center justify-center text-white relative">
          <span id="displayIncomplete" class="text-4xl sm:text-5xl font-black leading-none">가</span>
          <div id="batchimSlot" class="mt-1 w-10 h-6 rounded-md border-2 border-dashed border-indigo-300 bg-indigo-800/50 flex items-center justify-center text-base font-black text-amber-300">?</div>
          <span id="displayComplete" class="hidden text-4xl sm:text-5xl font-black leading-none text-amber-300">강</span>
        </div>
      </div>

      <div class="absolute bottom-2 left-0 right-0 h-7 border-t border-red-500/50 bg-red-900/20 flex items-center justify-center z-0">
        <span class="text-[10px] font-black text-red-400 tracking-widest bg-slate-900 px-2 rounded-full">DEAD LINE</span>
      </div>
    </div>

    <!-- Bottom Palette (원래 위치로 복원: p-3 bg-slate-950) -->
    <div class="p-3 bg-slate-950 border-t border-slate-800 z-20 shrink-0">
      <div class="text-[10px] font-bold text-slate-400 mb-1.5">当てはまるパッチムを選択</div>
      <div id="batchimButtonsContainer" class="grid gap-2"></div>
    </div>

    <!-- Modals -->
    <div id="startScreen" class="absolute inset-0 bg-slate-950/95 z-30 flex flex-col p-5 items-center justify-center text-center">
      <div class="text-6xl mb-4 animate-bounce">💥</div>
      <h1 class="text-3xl font-black mb-1">받침 크러셔</h1>
      <p class="text-xs text-slate-400 mb-6">全95単語収録 (パッチム完全攻略)</p>
      
      <div class="w-full max-w-xs space-y-2" id="stageBtnGroup"></div>
    </div>

    <div id="feedbackModal" class="absolute inset-0 bg-slate-950/90 z-40 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-slate-900 border-2 border-red-500 rounded-2xl p-5 shadow-2xl text-center">
        <div class="text-3xl mb-2">❌</div>
        <h3 class="text-base font-black text-white mb-4">おしい！</h3>
        <div class="flex justify-center gap-3 mb-4">
          <div class="flex-1 bg-red-950/50 p-3 rounded-xl border border-red-500/30">
            <div class="text-[10px] text-red-400 font-bold mb-1">あなたが選んだ</div>
            <div id="modalWrongChar" class="text-3xl font-black text-red-300">감</div>
          </div>
          <div class="flex-1 bg-emerald-950/50 p-3 rounded-xl border border-emerald-500/50">
            <div class="text-[10px] text-emerald-400 font-bold mb-1">正解</div>
            <div id="modalCorrectChar" class="text-3xl font-black text-emerald-400">강</div>
          </div>
        </div>
        <p id="modalTipJa" class="text-xs text-slate-300 bg-slate-800 p-3 rounded-lg mb-5 text-left leading-relaxed">ポイント解説</p>
        
        <div class="flex gap-2">
          <button id="btnPlayCompare" class="flex-1 py-3 rounded-xl bg-slate-800 active:bg-slate-700 text-xs font-bold text-white shadow-md border border-slate-700 flex items-center justify-center gap-1">
            <i class="ph-bold ph-speaker-high text-pink-400 text-lg"></i> 比較して聞く
          </button>
          <button id="btnDismissModal" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-xs font-bold text-white shadow-md active:scale-95">
            次へ進む
          </button>
        </div>
      </div>
    </div>

    <!-- Result Modal (홈으로 돌아가기 버튼 정상 동작) -->
    <div id="resultScreen" class="absolute inset-0 bg-slate-950/95 z-50 hidden flex flex-col p-5 items-center justify-center text-center">
      <div id="resultIcon" class="text-6xl mb-4">🏆</div>
      <h2 id="resultTitle" class="text-2xl font-black mb-2">CLEAR!</h2>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-xs mb-6 space-y-2">
        <div class="flex justify-between text-sm"><span class="text-slate-400">SCORE</span><span id="resScore" class="font-bold text-amber-400">0</span></div>
      </div>
      <button id="btnNextStage" class="w-full max-w-xs py-3.5 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold mb-3 shadow-lg active:scale-95 transition-all">次のステージへ</button>
      <button id="btnHomeFromResult" class="w-full max-w-xs py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-bold text-slate-300 active:scale-95 transition-all border border-slate-700">タイトルに戻る</button>
    </div>

  </main>

      q('이','ㄹ','仕事/数字의1','舌を上あごにつける音','💼'), q('이','ㅂ','口','唇を閉じて息を止める音','👄'),
      q('자','ㅁ','眠り','唇を閉じる音','💤'), q('자','ㄴ','グラス/杯','舌先をつける音','🍷'), q('자','ㅇ','枚','口を開けたままの音','📄'),
      q('자','ㄹ','よく(上手に)','舌を上あごにつける音','👍'),
      q('저','ㄴ','チヂミ/前','舌先をつける音', IMG_JEON_SVG),
      q('저','ㄹ','お寺/お辞儀','舌を上あごにつける音','🛕'), q('저','ㅇ','情','口を開けたままの音','💖'),
      q('조','ㅇ','鐘','口を開けたままの音','🔔'), q('지','ㅁ','荷物','唇を閉じる音','📦'),
      q('차','ㅁ','本当に/真','唇を閉じる音','✨'), q('차','ㅇ','窓','口を開けたままの音','🪟'),
      q('처','ㄴ','数字の1000/布','舌先をつける音','천'), q('처','ㄹ','鉄','舌を上あごにつける音','⚙️'),
      q('초','ㅇ','銃/総〜','口を開けたままの音','🔫'),
      q('추','ㅁ','踊り','唇を閉じる音','💃'),
      q('츠','ㅇ','階/層','口を開けたままの音','🏢'),
      q('치','ㄹ','数字の7','舌を上あごにつける音','7️⃣'),
      q('커','ㅂ','コップ','唇を閉じて息を止める音','☕'), q('카','ㄹ','包丁/刀','舌を上あごにつける音','🔪'), q('코','ㅇ','豆','口を開けたままの音','🫘'),
      q('터','ㄹ','毛','舌を上あごにつける音','🪶'), q('트','ㅁ','隙間','唇를閉じる音','틈'), q('티','ㅁ','チーム','唇を閉じる音','👥'),
      q('파','ㅌ','小豆','舌先で息を止める音','🫘'), q('파','ㄹ','腕/数字の8','舌を上あごにつける音','💪'), q('푸','ㄹ','草/糊','舌を上あごにつける音','🌿'),
      q('히','ㅁ','力','唇を閉じる音','💪')
    ];

    /* k, p, t 계열 음소 그룹 */
    const K_GROUP = ['ㄱ','ㄲ','ㅋ'];
    const P_GROUP = ['ㅂ','ㅍ'];
    const T_GROUP = ['ㅅ','ㅆ','ㄷ','ㅌ','ㅈ','ㅊ','ㅎ'];

    /* ==========================================================
       스테이지 설정
    ========================================================== */
    const STAGES = [
      { 
        title: "Stage 1: 鼻音 (ㄴ/ㅁ/ㅇ)", 
        questions: ALL_WORDS.filter(w => ['ㄴ','ㅇ','ㅁ'].includes(w.correctBatchim)).sort(()=>Math.random()-0.5).slice(0, 10) 
      },
      { 
        title: "Stage 2: 舌先と流音 (ㄴ/ㄹ)", 
        questions: ALL_WORDS.filter(w => ['ㄴ','ㄹ'].includes(w.correctBatchim)).sort(()=>Math.random()-0.5).slice(0, 10) 
      },
      { 
        title: "Stage 3: 息止め (k/p/t 閉鎖音)", 
        questions: ALL_WORDS.filter(w => [...K_GROUP, ...P_GROUP, ...T_GROUP].includes(w.correctBatchim)).sort(()=>Math.random()-0.5).slice(0, 10) 
      },
      { 
        title: "Stage 4: 総合ランダム", 
        questions: [...ALL_WORDS].sort(()=>Math.random()-0.5).slice(0, 15) 
      }
    ];

    /* ==========================================================
       받침 버튼 동적/고정 생성 규칙
    ========================================================== */
    function generateDynamicOptions(stageIdx, correct) {
      // Stage 1 고정: [ ㄴ, ㅁ, ㅇ ]
      if (stageIdx === 0) {
        return ['ㄴ', 'ㅁ', 'ㅇ'];
      }
      
      // Stage 2 고정: [ ㄴ, ㄹ ]
      if (stageIdx === 1) {
        return ['ㄴ', 'ㄹ'];
      }
      
      // Stage 3 고정 순서: [ K계열, P계열, T계열 ]
      if (stageIdx === 2) {
        let k = K_GROUP.includes(correct) ? correct : 'ㄱ';
        let p = P_GROUP.includes(correct) ? correct : 'ㅂ';
        let t = T_GROUP.includes(correct) ? correct : 'ㅅ';
        return [k, p, t];
      }
      
      // Stage 4 (종합 랜덤): 7개 카테고리 중 5개 무작위 추출 후 1~7번 오름차순 정렬
      if (stageIdx === 3) {
        const CATEGORIES = [
          { id: 1, defaultChar: 'ㄴ', members: ['ㄴ'] },
          { id: 2, defaultChar: 'ㅁ', members: ['ㅁ'] },
          { id: 3, defaultChar: 'ㅇ', members: ['ㅇ'] },
          { id: 4, defaultChar: 'ㄹ', members: ['ㄹ'] },
          { id: 5, defaultChar: 'ㄱ', members: K_GROUP },
          { id: 6, defaultChar: 'ㅂ', members: P_GROUP },
          { id: 7, defaultChar: 'ㅅ', members: T_GROUP }
        ];

        let correctCat = CATEGORIES.find(c => c.members.includes(correct)) || CATEGORIES[0];
        let otherCats = CATEGORIES.filter(c => c.id !== correctCat.id).sort(() => Math.random() - 0.5);
        let selectedCats = [correctCat, ...otherCats.slice(0, 4)];

        // 번호순(1~7) 오름차순 정렬 (앞 숫자가 빠른 순)
        selectedCats.sort((a, b) => a.id - b.id);

        return selectedCats.map(cat => (cat.id === correctCat.id ? correct : cat.defaultChar));
      }

      return ['ㄴ', 'ㅁ', 'ㅇ'];
    }

    /* TTS Audio */
    let synth = window.speechSynthesis;
    let utteranceCache = []; 

    function speakKorean(text, rate = 0.85, callback = null) {
      if (!synth) { if(callback) callback(); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = rate;
      if (callback) u.onend = callback;
      utteranceCache.push(u);
      if(utteranceCache.length > 5) utteranceCache.shift();
      synth.speak(u);
    }

    const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    function composeHangul(base, jongChar) {
      if (!base) return base;
      const code = base.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) return base;
      const cho = Math.floor(code / 588);
      const jung = Math.floor((code % 588) / 28);
      const jongIdx = JONG.indexOf(jongChar);
      if (jongIdx === -1) return base;
      return String.fromCharCode(0xAC00 + (cho * 588) + (jung * 28) + jongIdx);
    }

    let currentStage = 0;
    let qIndex = 0;
    let lives = 5;
    let score = 0;
    
    let animFrameId = null;
    let blockY = -120;
    let isFalling = false;
    let isPaused = false;
    let fallSpeed = 0.8;
    let targetWordStr = "";

    let timer2Sec = null;
    let timer5SecPause = null;
    let countdownInterval = null;

    const blockWrapper = document.getElementById('fallingBlockWrapper');
    const playField = document.getElementById('playField');
    const countdownText = document.getElementById('countdownText');

    document.getElementById('btnUnlock').addEventListener('click', () => {
      speakKorean(''); 
      document.getElementById('unlockOverlay').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      renderStartScreen();
    });

    function renderStartScreen() {
      const g = document.getElementById('stageBtnGroup');
      g.innerHTML = '';
      STAGES.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-sm text-left border border-slate-700 flex justify-between active:scale-95 transition-all";
        btn.innerHTML = `<span>${s.title}</span><span class="text-pink-400">▶</span>`;
        btn.onclick = () => startGame(idx);
        g.appendChild(btn);
      });
      document.getElementById('startScreen').classList.remove('hidden');
    }

    function startGame(idx) {
      currentStage = idx;
      qIndex = 0;
      lives = 5;
      score = 0;
      updateHeader();
      
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('feedbackModal').classList.add('hidden');
      document.getElementById('stageBadge').textContent = `STAGE ${idx + 1}`;
      
      loadQuestion();
    }

    function updateHeader() {
      document.getElementById('scoreDisplay').textContent = score.toString().padStart(4, '0');
      for(let i=1; i<=5; i++){
        const h = document.getElementById('h'+i);
        if(i <= lives) h.className = "ph-fill ph-heart text-red-500 text-sm";
        else h.className = "ph-bold ph-heart-break text-slate-700 text-sm";
      }
    }

    function loadQuestion() {
      clearAllTimers();
      const stage = STAGES[currentStage];
      if (qIndex >= stage.questions.length) {
        showResult(true);
        return;
      }
      
      const q = stage.questions[qIndex];
      targetWordStr = composeHangul(q.base, q.correctBatchim);
      
      const opts = generateDynamicOptions(currentStage, q.correctBatchim);
      const bc = document.getElementById('batchimButtonsContainer');
      bc.style.gridTemplateColumns = `repeat(${opts.length}, minmax(0, 1fr))`;
      bc.innerHTML = '';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "retro-btn bg-slate-800 border-2 border-slate-700 h-16 rounded-xl text-2xl font-black active:bg-indigo-600";
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(opt);
        bc.appendChild(btn);
      });

      document.getElementById('progressBar').style.width = `${((qIndex)/stage.questions.length)*100}%`;
      
      document.getElementById('displayIncomplete').textContent = q.base;
      document.getElementById('displayIncomplete').classList.remove('hidden');
      document.getElementById('batchimSlot').textContent = '?';
      document.getElementById('batchimSlot').classList.remove('hidden', 'snap-anim');
      document.getElementById('displayComplete').classList.add('hidden');
      document.getElementById('syllableBox').className = "w-22 h-22 sm:w-24 sm:h-24 rounded-2xl bg-indigo-600 border-4 border-indigo-400 shadow-xl flex flex-col items-center justify-center text-white relative transition-all";
      
      document.getElementById('hintEmoji').innerHTML = q.emoji || '❓';
      document.getElementById('hintMeaningJa').textContent = q.meaningJa;
      countdownText.classList.add('hidden');
      
      blockY = -100;
      isFalling = true;
      isPaused = false;
      fallSpeed = 1.0;
      
      speakKorean(targetWordStr); 
      timer2Sec = setTimeout(() => { speakKorean(targetWordStr); }, 2000); 

      requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
      if (!isFalling) return;
      
      if (!isPaused) {
        blockY += fallSpeed;
        blockWrapper.style.top = blockY + 'px';
        
        const maxH = playField.clientHeight - 80;
        
        // 5초 대기 멈춤 위치: 상단 22% 높이
        if (blockY > maxH * 0.22 && fallSpeed === 1.0) {
          isPaused = true;
          start5SecPause();
        }
        
        if (blockY > maxH) {
          handleTimeout();
          return;
        }
      }
      animFrameId = requestAnimationFrame(gameLoop);
    }

    function start5SecPause() {
      let count = 5;
      countdownText.textContent = count;
      countdownText.classList.remove('hidden');
      
      countdownInterval = setInterval(() => {
        count--;
        if(count > 0) {
          countdownText.textContent = count;
        } else {
          clearInterval(countdownInterval);
          countdownText.classList.add('hidden');
          isPaused = false;
          fallSpeed = 0.35; 
          speakKorean(targetWordStr);
        }
      }, 1000);
    }

    function clearAllTimers() {
      clearTimeout(timer2Sec);
      clearTimeout(timer5SecPause);
      clearInterval(countdownInterval);
      cancelAnimationFrame(animFrameId);
      isFalling = false;
    }

    function handleAnswer(ans) {
      if (!isFalling) return;
      clearAllTimers();
      
      const q = STAGES[currentStage].questions[qIndex];
      const formed = composeHangul(q.base, ans);
      
      document.getElementById('batchimSlot').textContent = ans;
      document.getElementById('batchimSlot').classList.add('snap-anim');
      
      setTimeout(() => {
        document.getElementById('displayIncomplete').classList.add('hidden');
        document.getElementById('batchimSlot').classList.add('hidden');
        document.getElementById('displayComplete').textContent = formed;
        document.getElementById('displayComplete').classList.remove('hidden');

        if (ans === q.correctBatchim) {
          handleCorrect(formed);
        } else {
          handleWrong(ans, formed, q);
        }
      }, 150);
    }

    function handleCorrect(word) {
      score += 100;
      updateHeader();
      speakKorean(word);
      document.getElementById('syllableBox').className = "w-22 h-22 sm:w-24 sm:h-24 rounded-2xl bg-emerald-500 border-4 border-emerald-300 shadow-xl flex flex-col items-center justify-center text-white crush-anim";
      
      if(window.confetti) {
        const rect = document.getElementById('syllableBox').getBoundingClientRect();
        confetti({
          particleCount: 20, spread: 50,
          origin: { x: (rect.left+rect.width/2)/window.innerWidth, y: (rect.top+rect.height/2)/window.innerHeight }
        });
      }
      setTimeout(() => { qIndex++; loadQuestion(); }, 400);
    }

    function handleWrong(ans, wrongWord, q) {
      lives--;
      updateHeader();
      document.getElementById('syllableBox').className = "w-22 h-22 sm:w-24 sm:h-24 rounded-2xl bg-red-600 border-4 border-red-400 shadow-xl flex flex-col items-center justify-center text-white shake-anim";
      
      setTimeout(() => {
        if(lives <= 0) showResult(false);
        else showFeedbackModal(ans, wrongWord, q);
      }, 400);
    }

    function handleTimeout() {
      clearAllTimers();
      lives--;
      updateHeader();
      document.getElementById('syllableBox').className = "w-22 h-22 sm:w-24 sm:h-24 rounded-2xl bg-red-900 border-4 border-red-500 flex flex-col items-center justify-center text-white shake-anim";
      const q = STAGES[currentStage].questions[qIndex];
      setTimeout(() => {
        if(lives <= 0) showResult(false);
        else showFeedbackModal("-", "時間切れ", q);
      }, 400);
    }

    function showFeedbackModal(ans, wrongWord, q) {
      const correctWord = composeHangul(q.base, q.correctBatchim);
      document.getElementById('modalWrongChar').textContent = wrongWord;
      document.getElementById('modalCorrectChar').textContent = correctWord;
      document.getElementById('modalTipJa').innerHTML = `💡 ${q.tip}`;
      
      const modal = document.getElementById('feedbackModal');
      modal.classList.remove('hidden');

      document.getElementById('btnPlayCompare').onclick = () => {
        if(ans !== "-") {
          speakKorean(wrongWord, 0.85, () => { setTimeout(()=>speakKorean(correctWord, 0.85), 500); });
        } else {
          speakKorean(correctWord);
        }
      };

      document.getElementById('btnDismissModal').onclick = () => {
        modal.classList.add('hidden');
        qIndex++;
        loadQuestion();
      };
    }

    function showResult(isClear) {
      clearAllTimers();
      const rs = document.getElementById('resultScreen');
      rs.classList.remove('hidden');
      document.getElementById('resultIcon').textContent = isClear ? '🏆' : '💀';
      document.getElementById('resultTitle').textContent = isClear ? 'STAGE CLEAR' : 'GAME OVER';
      document.getElementById('resScore').textContent = score;
      document.getElementById('btnNextStage').classList.toggle('hidden', !isClear);
    }

    function goHome() {
      clearAllTimers();
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('feedbackModal').classList.add('hidden');
      renderStartScreen();
    }

    document.getElementById('btnHome').onclick = goHome;
    document.getElementById('btnHomeFromResult').onclick = goHome;
    document.getElementById('btnNextStage').onclick = () => { startGame((currentStage + 1) % STAGES.length); };
    document.getElementById('btnReplayAudio').onclick = () => { if(targetWordStr) speakKorean(targetWordStr); };
  </script>
