name: Build Pure APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Capacitor 5
        run: |
          npm init -y
          npm i @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8
          mkdir -p www
          cp index.html www/
          npx cap init "KoreanGame" "com.songkankokugo.ilin" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
